{% load i18n %}
  <form action="{% url 'vols:search_results' %}" method="post" class="search-card" id="searchForm">
    {% csrf_token %}

    <!-- ══ Mode Tabs ══ -->
    <div class="flight-mode-tabs" id="flightModeTabs">
      <button type="button" class="flight-mode-tab active" id="tab-international" onclick="setFlightMode('international')">
        🌍 {% trans "دولي" %}
      </button>
      <button type="button" class="flight-mode-tab" id="tab-domestic" onclick="setFlightMode('domestic')">
        ✈ {% trans "داخلي" %}
      </button>
      <button type="button" class="flight-mode-tab" id="tab-ferry" onclick="setFlightMode('ferry')">
        ⛴ {% trans "باخرة" %}
      </button>
    </div>
    <input type="hidden" name="flight_mode" id="flight_mode_input" value="international">

    <!-- ══ Trip Type (Flights) ══ -->
    <div class="trip-type-selector" id="tripTypeRow">
      <label class="radio-tab">
        <input type="radio" name="trip_type" value="oneway" {% if search.trip_type == 'oneway' or not search %}checked{% endif %} onchange="onTripTypeChange(this)">
        <span>🡒 {% trans "ذهاب فقط" %}</span>
      </label>
      <label class="radio-tab">
        <input type="radio" name="trip_type" value="roundtrip" {% if search.trip_type == 'roundtrip' %}checked{% endif %} onchange="onTripTypeChange(this)">
        <span>⇄ {% trans "ذهاب وعودة" %}</span>
      </label>
      <label class="radio-tab" id="multicityTab">
        <input type="radio" name="trip_type" value="multicity" {% if search.trip_type == 'multicity' %}checked{% endif %} onchange="onTripTypeChange(this)">
        <span>✈✈ {% trans "وجهات متعددة" %}</span>
      </label>
    </div>

    <!-- ══ Trip Type (Ferry only) ══ -->
    <div class="trip-type-selector" id="ferryTripTypeRow" style="display:none;">
      <label class="radio-tab">
        <input type="radio" name="ferry_trip_type" id="ferryOneway" value="oneway" checked onchange="toggleFerryReturn()">
        <span>⛴ {% trans "ذهاب فقط" %}</span>
      </label>
      <label class="radio-tab">
        <input type="radio" name="ferry_trip_type" id="ferryRoundtrip" value="roundtrip" onchange="toggleFerryReturn()">
        <span>⛴↩ {% trans "ذهاب وإياب" %}</span>
      </label>
    </div>

    <!-- ══ Slices Container (Dynamic) ══ -->
    <div id="slices-container">
      <div class="search-all-fields" id="slice_0">

        <!-- ── ROW 1: Origin 50% | Swap | Destination 50% ── -->
        <div class="search-route-row">

          <div class="form-field field-origin autocomplete-wrapper" id="origin_wrapper_0">
            <label class="field-label">{% trans "المغادرة" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">🛫</span>
              <input type="text" name="origin_0" id="origin_0"
                placeholder="{% trans 'مثل: باريس، LHR' %}"
                required class="field-input autocomplete-input" autocomplete="off"
                value="{{ search.slices.0.origin|default:'' }}">
            </div>
            <div class="autocomplete-dropdown" id="dropdown_origin_0" style="display:none;"></div>
            <div class="ferry-city-hint" id="origin_city_hint">🛳 بورتسودان — Port Sudan</div>
          </div>

          <button type="button" class="swap-btn" id="swapBtn_0" title="Swap" onclick="swapFields('origin_0','destination_0')">⇄</button>

          <div class="form-field field-dest autocomplete-wrapper" id="dest_wrapper_0">
            <label class="field-label">{% trans "الوجهة" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">🛬</span>
              <input type="text" name="destination_0" id="destination_0"
                placeholder="{% trans 'مثل: لندن، DXB' %}"
                required class="field-input autocomplete-input" autocomplete="off"
                value="{{ search.slices.0.destination|default:'' }}">
            </div>
            <div class="autocomplete-dropdown" id="dropdown_destination_0" style="display:none;"></div>
            <div class="ferry-city-hint" id="dest_city_hint">🛳 جدة — Jeddah Islamic Port</div>
          </div>

        </div><!-- /search-route-row -->

        <!-- ── ROW 2: Dates | Passengers | Cabin | Search ── -->
        <div class="search-row2">

          <!-- Departure date -->
          <div class="form-field field-date">
            <label class="field-label">{% trans "تاريخ الذهاب" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">📅</span>
              <input type="date" name="departure_date_0" id="departure_date_0"
                required class="field-input date-input"
                value="{{ search.slices.0.departure_date|default:'' }}">
            </div>
          </div>

          <!-- Return date (round-trip flights) -->
          <div class="form-field field-date" id="return_date_wrapper" style="display:none;">
            <label class="field-label">{% trans "تاريخ العودة" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">📅</span>
              <input type="date" name="return_date" id="return_date"
                class="field-input date-input"
                value="{% if search.trip_type == 'roundtrip' %}{{ search.slices.1.departure_date|default:'' }}{% endif %}">
            </div>
          </div>

          <!-- Ferry return date -->
          <div class="form-field field-date" id="ferry_return_wrapper" style="display:none;">
            <label class="field-label">⛴↩ {% trans "عودة من جدة" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">📅</span>
              <input type="date" name="ferry_return_date" id="ferry_return_date" class="field-input date-input">
            </div>
          </div>

          <!-- Passengers -->
          <div class="form-field field-pax" style="position:relative;">
            <label class="field-label">{% trans "المسافرون" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">&#128101;</span>
              <button type="button" id="paxToggle" class="field-input"
                style="text-align:right; cursor:pointer; background:var(--bg-2,#fff); display:flex; align-items:center; justify-content:space-between; gap:4px; width:100%; min-width:0; border:none; font-family:inherit; font-size:inherit; overflow:hidden;"
                data-t-adult1="{% trans 'بالغ واحد' %}"
                data-t-adult2="{% trans 'بالغان' %}"
                data-t-adults="{% trans 'بالغين' %}"
                data-t-child1="{% trans '+ طفل واحد' %}"
                data-t-children="{% trans 'أطفال' %}">
                <span id="paxSummary" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;">{% trans "بالغ واحد" %}</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0; opacity:0.5;"><path d="M1 4l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <input type="hidden" name="adults"   id="adults_input"   value="{{ search.adults|default:1 }}">
            <input type="hidden" name="children" id="children_input" value="{{ search.children|default:0 }}">
          </div><!-- /field-pax -->

          <!-- Cabin class -->
          <div class="form-field field-cabin">
            <label class="field-label">{% trans "الدرجة" %}</label>
            <div class="input-icon-wrap">
              <span class="fi">💺</span>
              <select name="cabin_class" class="field-input">
                <option value="economy" {% if search.cabin_class == 'economy' or not search.cabin_class %}selected{% endif %}>{% trans "سياحية" %}</option>
                <option value="premium_economy" {% if search.cabin_class == 'premium_economy' %}selected{% endif %}>{% trans "سياحية ممتازة" %}</option>
                <option value="business" {% if search.cabin_class == 'business' %}selected{% endif %}>{% trans "أعمال" %}</option>
                <option value="first" {% if search.cabin_class == 'first' %}selected{% endif %}>{% trans "أولى" %}</option>
              </select>
            </div>
          </div>

        </div><!-- /search-row2 -->

        <!-- Search Button — Row 3, full width -->
        <div class="form-actions-submit">
          <button type="submit" class="btn btn-primary search-submit" id="searchBtn">
            🔍 <span id="searchBtnLabel">{% trans "ابحث" %}</span>
          </button>
        </div>


      </div><!-- /search-all-fields -->
    </div><!-- /slices-container -->


    <!-- ══ Multi-city Container (hidden until multicity tab selected) ══ -->
    <div id="multicitySection" style="display:none; margin-top:4px;">

      <!-- Slices (flight segments) -->
      <div id="multicity-slices">
        <!-- JS will inject rows here -->
      </div>

      <!-- Bottom bar: Add + Pax + Cabin + Search -->
      <div class="mc-bottom-bar" style="margin-top:10px;">
        <button type="button" class="mc-add-btn" id="mcAddBtn" onclick="mcAddSlice()">
          ✈ + {% trans "إضافة وجهة أخرى" %}
        </button>
        <!-- Pax (shared with main form) -->
        <div class="form-field" style="position:relative; flex:1; min-width:140px;">
          <label class="field-label">{% trans "المسافرون" %}</label>
          <div class="input-icon-wrap">
            <span class="fi">&#128101;</span>
            <button type="button" id="paxToggle2" class="field-input"
              style="text-align:right; cursor:pointer; background:var(--bg-2,#fff); display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:none; font-family:inherit; font-size:inherit;"
              onclick="document.getElementById('paxToggle').click()">
              <span id="paxSummary2">{% trans "بالغ واحد" %}</span>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;opacity:0.5;"><path d="M1 4l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <!-- Cabin -->
        <div class="form-field" style="flex:1; min-width:140px;">
          <label class="field-label">{% trans "الدرجة" %}</label>
          <div class="input-icon-wrap">
            <span class="fi">💺</span>
            <select name="cabin_class_mc" class="field-input" onchange="document.querySelector('select[name=cabin_class]').value=this.value">
              <option value="economy">{% trans "سياحية" %}</option>
              <option value="premium_economy">{% trans "سياحية ممتازة" %}</option>
              <option value="business">{% trans "أعمال" %}</option>
              <option value="first">{% trans "أولى" %}</option>
            </select>
          </div>
        </div>
        <!-- Search -->
        <div style="flex:0 0 auto;">
          <button type="submit" form="searchForm" class="btn btn-primary search-submit" style="height:48px; padding:0 28px; border-radius:50px; color:#fff; font-size:1rem; font-weight:800; white-space:nowrap;">
            🔍 {% trans "ابحث" %}
          </button>
        </div>
      </div>
    </div><!-- /multicitySection -->

    <div id="paxDropdown" style="display:none; position:fixed; z-index:99999;
        background:var(--bg-2,#fff); padding:20px; border-radius:16px;
        box-shadow:0 20px 60px rgba(0,0,0,0.2); border:1px solid var(--border,#e2e8f0);
        width:290px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--border,#e2e8f0);">
          <div>
            <div style="font-weight:700; font-size:0.95rem; color:var(--text,#1a202c);">{% trans "بالغون" %}</div>
            <div style="font-size:0.75rem; color:var(--text-muted,#718096);">{% trans "12 سنة وما فوق" %}</div>
          </div>
          <div style="display:flex; align-items:center; gap:14px;">
            <button type="button" onclick="changePax('adults',-1)" class="pax-ctrl-btn">&#8722;</button>
            <span id="adults_display" style="font-weight:800; font-size:1.15rem; min-width:24px; text-align:center; color:var(--text,#1a202c);">{{ search.adults|default:1 }}</span>
            <button type="button" onclick="changePax('adults',1)" class="pax-ctrl-btn">&#43;</button>
          </div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border,#e2e8f0);">
          <div>
            <div style="font-weight:700; font-size:0.95rem; color:var(--text,#1a202c);">{% trans "أطفال" %}</div>
            <div style="font-size:0.75rem; color:var(--text-muted,#718096);">{% trans "من 2 إلى 11 سنة" %} &middot; <span style="color:#d97706;">75% {% trans "من سعر البالغ" %}</span></div>
          </div>
          <div style="display:flex; align-items:center; gap:14px;">
            <button type="button" onclick="changePax('children',-1)" class="pax-ctrl-btn">&#8722;</button>
            <span id="children_display" style="font-weight:800; font-size:1.15rem; min-width:24px; text-align:center; color:var(--text,#1a202c);">{{ search.children|default:0 }}</span>
            <button type="button" onclick="changePax('children',1)" class="pax-ctrl-btn">&#43;</button>
          </div>
        </div>
        <button type="button" onclick="closePaxDropdown()"
          style="width:100%; background:var(--primary,#1ba4ba); color:#fff; border:none; padding:11px; border-radius:10px; font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:0.95rem;">
          &#10003; {% trans "تأكيد" %}
        </button>
      </div>

      <style>
        /* ── Flight Mode Tabs — Full-width, no overflow ─────────── */
        .flight-mode-tabs {
          display: flex;
          gap: 4px;
          margin-bottom: 20px;
          background: rgba(0,0,0,0.06);
          padding: 5px;
          border-radius: 14px;
          width: 100%;          /* stretch full card width */
          box-sizing: border-box;
        }
        .flight-mode-tab {
          flex: 1;              /* equal width for all 3 tabs */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1px;
          padding: 9px 6px;
          border-radius: 10px;
          border: none;
          background: transparent;
          font-family: 'Tajawal', sans-serif;
          cursor: pointer;
          transition: all 0.22s ease;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          min-width: 0;
        }
        .flight-mode-tab .tab-label-ar {
          font-size: 0.88rem;
          font-weight: 700;
          color: inherit;
          line-height: 1.2;
        }
        .flight-mode-tab .tab-label-en {
          font-size: 0.66rem;
          font-weight: 600;
          opacity: 0.7;
          color: inherit;
          line-height: 1;
        }
        .flight-mode-tab.active {
          background: var(--primary, #1ba4ba);
          color: #fff;
          box-shadow: 0 4px 14px rgba(27,164,186,0.35);
        }
        .flight-mode-tab.active .tab-label-en { opacity: 0.85; }
        .flight-mode-tab:not(.active) {
          color: var(--text-muted, #718096);
        }
        .flight-mode-tab:not(.active):hover {
          background: rgba(27,164,186,0.1);
          color: var(--primary, #1ba4ba);
        }
        /* small phones: shrink emoji + text a bit more */
        @media (max-width: 380px) {
          .flight-mode-tab { padding: 8px 3px; }
          .flight-mode-tab .tab-label-ar { font-size: 0.78rem; }
          .flight-mode-tab .tab-label-en { font-size: 0.6rem; }
        }

        /* Sudan domestic badge on airport dropdown items */
        .ac-item-domestic .ac-iata {
          background: #007229;
          color: #fff;
        }

        .pax-ctrl-btn {
          width:34px; height:34px; border-radius:50%;
          border:2px solid var(--primary,#1ba4ba);
          background:transparent; color:var(--primary,#1ba4ba);
          font-size:1.2rem; font-weight:800; cursor:pointer;
          display:flex; align-items:center; justify-content:center;
          transition:0.2s; line-height:1; padding:0;
        }
        .pax-ctrl-btn:hover { background:var(--primary,#1ba4ba); color:#fff; }
      </style>


      <script>
      (function() {
        /* ── Passenger picker ─────────────────────────────────── */
        var _adults   = parseInt('{{ search.adults|default:1 }}') || 1;
        var _children = parseInt('{{ search.children|default:0}}') || 0;
        var _ddOpen   = false;

        function syncInputs() {
          document.getElementById('adults_input').value   = _adults;
          document.getElementById('children_input').value = _children;
          document.getElementById('adults_display').textContent   = _adults;
          document.getElementById('children_display').textContent = _children;
          var btn = document.getElementById('paxToggle');
          var t = {
            adult1:   btn.dataset.tAdult1,
            adult2:   btn.dataset.tAdult2,
            adults:   btn.dataset.tAdults,
            child1:   btn.dataset.tChild1,
            children: btn.dataset.tChildren
          };
          var parts = [];
          if (_adults === 1) parts.push(t.adult1);
          else if (_adults === 2) parts.push(t.adult2);
          else parts.push(_adults + ' ' + t.adults);
          if (_children === 1) parts.push(t.child1);
          else if (_children >= 2) parts.push(_children + ' ' + t.children);
          document.getElementById('paxSummary').textContent = parts.join(' ');
        }

        window.changePax = function(type, delta) {
          if (type === 'adults')   _adults   = Math.max(1, Math.min(9, _adults   + delta));
          if (type === 'children') _children = Math.max(0, Math.min(6, _children + delta));
          syncInputs();
        };

        function openDropdown() {
          var dd  = document.getElementById('paxDropdown');
          var btn = document.getElementById('paxToggle');
          var r   = btn.getBoundingClientRect();
          if (dd.parentElement !== document.body) document.body.appendChild(dd);
          var left = r.left;
          if (left + 300 > window.innerWidth) left = window.innerWidth - 300;
          dd.style.top  = (r.bottom + 6) + 'px';
          dd.style.left = Math.max(4, left) + 'px';
          dd.style.display = 'block';
          _ddOpen = true;
        }

        window.closePaxDropdown = function() {
          document.getElementById('paxDropdown').style.display = 'none';
          _ddOpen = false;
        };

        document.getElementById('paxToggle').addEventListener('click', function(e) {
          e.stopPropagation();
          _ddOpen ? closePaxDropdown() : openDropdown();
        });
        document.addEventListener('click', function(e) {
          if (_ddOpen && !e.target.closest('#paxDropdown') && !e.target.closest('#paxToggle'))
            closePaxDropdown();
        });
        window.addEventListener('scroll', function() { if (_ddOpen) closePaxDropdown(); }, true);
        window.addEventListener('resize',  function() { if (_ddOpen) closePaxDropdown(); });
        syncInputs();

        /* ── Flight mode tabs ─────────────────────────────────── */
        var INTL_PH_ORIG = "{% trans 'مثل: باريس، LHR، JFK' %}";
        var INTL_PH_DEST = "{% trans 'مثل: لندن، DXB' %}";
        var DOM_PH_ORIG  = "{% trans 'مثل: الخرطوم، PZU' %}";
        var DOM_PH_DEST  = "{% trans 'مثل: بورتسودان، KSL' %}";
        var FERRY_URL    = "{% url 'vols:ferry_search' %}";
        var FLIGHT_URL   = "{% url 'vols:search_results' %}";

        var _mode = 'international';

        window.setFlightMode = function(mode) {
          _mode = mode;
          document.getElementById('flight_mode_input').value = mode;

          // Update all 3 tab styles
          document.getElementById('tab-international').classList.toggle('active', mode === 'international');
          document.getElementById('tab-domestic').classList.toggle('active', mode === 'domestic');
          document.getElementById('tab-ferry').classList.toggle('active', mode === 'ferry');

          var orig0    = document.getElementById('origin_0');
          var dest0    = document.getElementById('destination_0');
          var form     = document.getElementById('searchForm');
          var tripRow  = document.getElementById('tripTypeRow');
          var cabinSel = document.querySelector('select[name="cabin_class"]');

          if (mode === 'ferry') {
            form.action       = FERRY_URL;
            orig0.value       = 'PZU';
            orig0.placeholder = 'ميناء بورتسودان (PZU)';
            orig0.readOnly    = true;
            dest0.value       = 'JED';
            dest0.placeholder = 'ميناء جدة الإسلامي (JED)';
            dest0.readOnly    = true;
            if (tripRow)  tripRow.style.display  = 'none';
            var ferryRow = document.getElementById('ferryTripTypeRow');
            if (ferryRow) ferryRow.style.display = '';
            // Show city hints for ferry ports
            var oh = document.getElementById('origin_city_hint');
            var dh = document.getElementById('dest_city_hint');
            if (oh) oh.style.display = 'block';
            if (dh) dh.style.display = 'block';
            // Reset ferry return date
            var frw = document.getElementById('ferry_return_wrapper');
            if (frw) frw.style.display = 'none';
            document.getElementById('ferryOneway').checked = true;
            if (cabinSel) cabinSel.innerHTML = '<option value="economy">اقتصادي (بدون كابينة)</option><option value="standard">عادي - 4 أشخاص</option><option value="first">أولى - كابينة خاصة</option><option value="vip">VIP - جناح فاخر</option>';
          } else {
            form.action    = FLIGHT_URL;
            orig0.readOnly = false;
            dest0.readOnly = false;
            // Hide city hints
            var oh = document.getElementById('origin_city_hint');
            var dh = document.getElementById('dest_city_hint');
            if (oh) oh.style.display = 'none';
            if (dh) dh.style.display = 'none';
            var ferryRow = document.getElementById('ferryTripTypeRow');
            if (ferryRow) ferryRow.style.display = 'none';
            var frw = document.getElementById('ferry_return_wrapper');
            if (frw) frw.style.display = 'none';
            if (tripRow) tripRow.style.display = '';
            if (cabinSel) cabinSel.innerHTML = '<option value="economy">{% trans "سياحية" %}</option><option value="premium_economy">{% trans "سياحية ممتازة" %}</option><option value="business">{% trans "أعمال" %}</option><option value="first">{% trans "أولى" %}</option>';
            if (mode === 'domestic') {
              orig0.value = ''; orig0.placeholder = DOM_PH_ORIG;
              dest0.value = ''; dest0.placeholder = DOM_PH_DEST;
              document.getElementById('multicityTab').style.display = 'none';
              var mt = document.querySelector('input[name="trip_type"][value="multicity"]');
              if (mt && mt.checked) document.querySelector('input[name="trip_type"][value="oneway"]').click();
            } else {
              orig0.value = ''; orig0.placeholder = INTL_PH_ORIG;
              dest0.value = ''; dest0.placeholder = INTL_PH_DEST;
              document.getElementById('multicityTab').style.display = '';
            }
            orig0.focus();
          }
        };

        /* ── Autocomplete (unified – handles all modes) ─────── */
        var SUDAN_AIRPORTS_URL = "{% url 'vols:api_sudan_airports' %}";
        var PLACES_URL         = "{% url 'vols:api_places' %}";


        function renderDropdown(dropdownEl, items, inputEl) {
          dropdownEl.innerHTML = '';
          if (!items.length) { dropdownEl.style.display = 'none'; return; }
          items.forEach(function(item) {
            var div = document.createElement('div');
            div.className = 'ac-item' + (item.is_domestic ? ' ac-item-domestic' : '');
            div.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border,#f0f0f0);transition:background 0.15s;';
            div.innerHTML =
              '<span class="ac-iata" style="font-weight:800;font-size:0.8rem;padding:3px 7px;border-radius:6px;background:var(--primary,#1ba4ba);color:#fff;min-width:38px;text-align:center;">'
              + (item.iata_code || '') + '</span>'
              + '<span style="font-size:0.9rem;color:var(--text,#1a202c);">'
              + (item.city || item.city_name || item.name || '') + '</span>';
            div.addEventListener('mouseenter', function() { this.style.background = 'var(--bg-hover,#f7fafc)'; });
            div.addEventListener('mouseleave', function() { this.style.background = ''; });
            div.addEventListener('mousedown', function(e) {
              e.preventDefault();
              inputEl.value = item.iata_code || item.id || '';
              dropdownEl.style.display = 'none';
            });
            dropdownEl.appendChild(div);
          });
          dropdownEl.style.display = 'block';
        }

        var _timers = {};
        function attachAutocomplete(inputId, dropdownId) {
          var inp = document.getElementById(inputId);
          var dd  = document.getElementById(dropdownId);
          if (!inp || !dd) return;

          inp.addEventListener('input', function() {
            var q = inp.value.trim();
            clearTimeout(_timers[inputId]);
            if (q.length < 1) { dd.style.display = 'none'; return; }
            _timers[inputId] = setTimeout(function() {
              var url = (_mode === 'domestic')
                ? SUDAN_AIRPORTS_URL + '?q=' + encodeURIComponent(q)
                : (_mode === 'ferry')
                  ? null   // ferry uses fixed ports, no autocomplete needed
                  : PLACES_URL + '?q=' + encodeURIComponent(q);
              if (!url) { dd.style.display = 'none'; return; }
              fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                  var results = data.results || [];
                  if (_mode === 'domestic') {
                    results = results.map(function(a) {
                      return { iata_code: a.iata_code, city: a.city + ' (' + a.city_en + ')', is_domestic: true };
                    });
                  } else {
                    results = results.map(function(p) {
                      return { iata_code: p.iata_code, city: p.name + (p.city_name ? ' – ' + p.city_name : ''), id: p.id };
                    });
                  }
                  renderDropdown(dd, results, inp);
                })
                .catch(function() { dd.style.display = 'none'; });
            }, 250);
          });

          inp.addEventListener('blur', function() {
            setTimeout(function() { dd.style.display = 'none'; }, 180);
          });
        }

        /* ── Multi-city: pre-defined labels (safe in JS strings) ── */
        var MC_LBL_FROM  = "{% trans 'المغادرة' %}";
        var MC_LBL_TO    = "{% trans 'الوجهة' %}";
        var MC_LBL_DATE  = "{% trans 'تاريخ الذهاب' %}";
        var MC_PH_ORIG   = INTL_PH_ORIG;
        var MC_PH_DEST   = INTL_PH_DEST;

        /* ── Multi-city slice counter ─────────────────────────── */
        var _mcSliceCount = 0;

        window.mcAddSlice = function() {
          if (_mcSliceCount >= 6) return; // max 6 segments
          _mcSliceCount++;
          var idx = _mcSliceCount;
          var container = document.getElementById('multicity-slices');
          var div = document.createElement('div');
          div.className = 'mc-slice';
          div.id = 'mc_slice_' + idx;

          var html = '';
          // Origin field
          html += '<div class="form-field autocomplete-wrapper">';
          html +=   '<label class="field-label">' + MC_LBL_FROM + '</label>';
          html +=   '<div class="input-icon-wrap">';
          html +=     '<span class="fi">🛫</span>';
          html +=     '<input type="text" name="origin_' + idx + '" id="mc_origin_' + idx + '"';
          html +=       ' placeholder="' + MC_PH_ORIG + '" class="field-input autocomplete-input"';
          html +=       ' autocomplete="off" required>';
          html +=   '</div>';
          html +=   '<div class="autocomplete-dropdown" id="mc_dd_orig_' + idx + '" style="display:none;"></div>';
          html += '</div>';
          // Swap btn
          html += '<button type="button" class="swap-btn" onclick="mcSwap(' + idx + ')">⇄</button>';
          // Destination field
          html += '<div class="form-field autocomplete-wrapper">';
          html +=   '<label class="field-label">' + MC_LBL_TO + '</label>';
          html +=   '<div class="input-icon-wrap">';
          html +=     '<span class="fi">🛬</span>';
          html +=     '<input type="text" name="destination_' + idx + '" id="mc_dest_' + idx + '"';
          html +=       ' placeholder="' + MC_PH_DEST + '" class="field-input autocomplete-input"';
          html +=       ' autocomplete="off" required>';
          html +=   '</div>';
          html +=   '<div class="autocomplete-dropdown" id="mc_dd_dest_' + idx + '" style="display:none;"></div>';
          html += '</div>';
          // Date field
          html += '<div class="form-field mc-date">';
          html +=   '<label class="field-label">' + MC_LBL_DATE + '</label>';
          html +=   '<div class="input-icon-wrap">';
          html +=     '<span class="fi">📅</span>';
          html +=     '<input type="date" name="departure_date_' + idx + '" class="field-input" required>';
          html +=   '</div>';
          html += '</div>';
          // Remove button
          html += '<button type="button" class="mc-remove" onclick="mcRemoveSlice(' + idx + ')">✕</button>';

          div.innerHTML = html;
          container.appendChild(div);
          attachAutocomplete('mc_origin_' + idx, 'mc_dd_orig_' + idx);
          attachAutocomplete('mc_dest_' + idx,   'mc_dd_dest_' + idx);
        };

        window.mcRemoveSlice = function(idx) {
          var el = document.getElementById('mc_slice_' + idx);
          if (el) el.remove();
        };

        window.mcSwap = function(idx) {
          var o = document.getElementById('mc_origin_' + idx);
          var d = document.getElementById('mc_dest_' + idx);
          if (o && d) { var t = o.value; o.value = d.value; d.value = t; }
        };

        window.onTripTypeChange = function(radio) {
          var val = radio.value;
          var retWrap    = document.getElementById('return_date_wrapper');
          var slicesWrap = document.getElementById('slices-container');
          var mcSection  = document.getElementById('multicitySection');
          var mcSlices   = document.getElementById('multicity-slices');

          if (val === 'roundtrip') {
            if (retWrap)    retWrap.style.display = '';
            if (slicesWrap) slicesWrap.style.display = '';
            if (mcSection)  mcSection.style.display = 'none';
          } else if (val === 'multicity') {
            if (retWrap)    retWrap.style.display = 'none';
            if (slicesWrap) slicesWrap.style.display = 'none';
            if (mcSection)  mcSection.style.display = '';
            // Seed with ONE slice if empty
            if (mcSlices && mcSlices.children.length === 0) {
              mcAddSlice();
            }
          } else {
            // oneway
            if (retWrap)    retWrap.style.display = 'none';
            if (slicesWrap) slicesWrap.style.display = '';
            if (mcSection)  mcSection.style.display = 'none';
          }
        };

        // Init on page load
        (function() {
          var checked = document.querySelector('input[name="trip_type"]:checked');
          if (checked) window.onTripTypeChange(checked);
        })();

        attachAutocomplete('origin_0',      'dropdown_origin_0');
        attachAutocomplete('destination_0', 'dropdown_destination_0');


      })();
      </script>

  </form>


<script>
  /* Global swap function — used by main route row and multi-city rows */
  window.swapFields = function(originId, destId) {
    var o = document.getElementById(originId);
    var d = document.getElementById(destId);
    if (o && d) {
      var tmp = o.value;
      o.value = d.value;
      d.value = tmp;
      // Animate the button
      var btn = document.querySelector('[onclick*="' + originId + '"]');
      if (btn) {
        btn.style.transform = 'rotate(180deg)';
        setTimeout(function() { btn.style.transform = ''; }, 300);
      }
    }
  };

  /* Ferry return date toggle */
  window.toggleFerryReturn = function() {
    var isRound = document.getElementById('ferryRoundtrip').checked;
    var frw     = document.getElementById('ferry_return_wrapper');
    var frd     = document.getElementById('ferry_return_date');
    var lbl     = document.getElementById('searchBtnLabel');
    if (frw) frw.style.display = isRound ? '' : 'none';
    if (frd) frd.required = isRound;
    if (lbl) lbl.textContent = isRound
      ? '⛴ ابحث — ذهاب وإياب'
      : '⛴ ابحث عن رحلة';
  };
</script>
